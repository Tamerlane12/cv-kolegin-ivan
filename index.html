<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>CV — Kolegin Ivan</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#202020;color:#fff;font-family:Arial,sans-serif}
body{overflow-y:auto}
.top{position:fixed;z-index:20;top:10px;right:10px;display:flex;gap:7px;opacity:.25;transition:.2s}
.top:hover,.top:focus-within{opacity:1}
button,.download{border:1px solid #777;background:rgba(20,20,20,.9);color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;text-decoration:none;cursor:pointer}
#viewer{width:100%;padding:0;margin:0 auto}
.page{display:block;margin:0 auto 8px;box-shadow:0 1px 4px #000;background:#fff;max-width:100%;height:auto}
.status{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);padding:12px 16px;border-radius:10px;font-size:14px}
@media(max-width:700px){
 .top{top:max(8px,env(safe-area-inset-top));right:8px}
 button,.download{padding:8px 10px;font-size:12px}
 #viewer{width:100vw}
 .page{width:100vw;max-width:100vw;margin:0 0 5px;box-shadow:none}
}
</style>
</head>
<body>
<div class="top">
<a class="download" href="CV_KOLEGIN_IVAN.pdf" download>↓ Скачать CV</a>
<button id="full">⛶ Экран</button>
</div>
<div id="status" class="status">Загрузка CV…</div>
<main id="viewer"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script type="module">
const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const viewer=document.getElementById("viewer"), status=document.getElementById("status");
const pdf=await pdfjsLib.getDocument({url:"CV_KOLEGIN_IVAN.pdf",disableAutoFetch:false}).promise;

async function render(){
  viewer.innerHTML="";
  const dpr=Math.min(window.devicePixelRatio||1,2);
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n);
    const base=page.getViewport({scale:1});
    const width=Math.min(window.innerWidth,1400);
    const scale=(width/base.width)*dpr;
    const viewport=page.getViewport({scale});
    const canvas=document.createElement("canvas");
    canvas.className="page";
    canvas.width=Math.ceil(viewport.width);
    canvas.height=Math.ceil(viewport.height);
    canvas.style.width=width+"px";
    canvas.style.height=(viewport.height/dpr)+"px";
    viewer.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext("2d",{alpha:false}),viewport}).promise;
  }
  status.remove();
}
document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
render().catch(e=>{status.textContent="Не удалось загрузить CV";console.error(e)});
</script>
</body>
</html>
