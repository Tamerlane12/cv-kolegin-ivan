<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CV — Kolegin Ivan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#202020;font-family:Arial,sans-serif}
body{overflow-y:auto}
#viewer{width:100%;padding:0}
.page{display:block;margin:0 auto 6px;background:#fff;box-shadow:0 1px 5px #000;max-width:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#202020;color:#fff;z-index:5}
.box{padding:18px 22px;border-radius:12px;background:#111;text-align:center}
#err{display:none;color:#ffb4b4;margin-top:10px;font-size:13px;max-width:280px}
.toolbar{position:fixed;z-index:10;top:10px;right:10px;display:flex;gap:7px;opacity:.3}
.toolbar:hover{opacity:1}
button,.download{border:1px solid #777;border-radius:8px;background:rgba(15,15,15,.92);color:#fff;padding:9px 12px;text-decoration:none;font-size:13px;cursor:pointer}
@media(max-width:700px){
 .page{width:100vw;max-width:100vw;box-shadow:none;margin-bottom:4px}
 .toolbar{top:max(8px,env(safe-area-inset-top));right:8px}
 button,.download{padding:8px 10px;font-size:12px}
}
</style>
</head>
<body>
<div id="loading"><div class="box">Загрузка CV…<div id="err"></div></div></div>
<div class="toolbar">
<a class="download" href="./CV_KOLEGIN_IVAN.pdf" download>↓ Скачать</a>
<button id="full">⛶ Экран</button>
</div>
<main id="viewer"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var viewer=document.getElementById('viewer');
  var loading=document.getElementById('loading');
  var err=document.getElementById('err');
  var url='./CV_KOLEGIN_IVAN.pdf';

  document.getElementById('full').onclick=function(){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };

  function fail(message){
    err.style.display='block';
    err.textContent=message;
  }

  if(!window.pdfjsLib){
    fail('Не удалось загрузить просмотрщик. Обновите страницу.');
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc=
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument({url:url}).promise.then(function(pdf){
    var jobs=[];
    for(var i=1;i<=pdf.numPages;i++) jobs.push(i);

    return jobs.reduce(function(p,n){
      return p.then(function(){
        return pdf.getPage(n).then(function(page){
          var base=page.getViewport({scale:1});
          var cssWidth=Math.min(window.innerWidth,1400);
          var dpr=Math.min(window.devicePixelRatio||1,2);
          var scale=(cssWidth/base.width)*dpr;
          var vp=page.getViewport({scale:scale});

          var canvas=document.createElement('canvas');
          canvas.className='page';
          canvas.width=Math.ceil(vp.width);
          canvas.height=Math.ceil(vp.height);
          canvas.style.width=cssWidth+'px';
          canvas.style.height=(vp.height/dpr)+'px';
          viewer.appendChild(canvas);

          return page.render({
            canvasContext:canvas.getContext('2d',{alpha:false}),
            viewport:vp
          }).promise;
        });
      });
    },Promise.resolve());
  }).then(function(){
    loading.style.display='none';
  }).catch(function(e){
    console.error(e);
    fail('Не удалось загрузить CV. Проверьте, что CV_KOLEGIN_IVAN.pdf находится в корне GitHub.');
  });
})();
</script>
</body>
</html>
