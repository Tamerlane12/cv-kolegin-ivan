<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CV — Kolegin Ivan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#202020;font-family:Arial,sans-serif}
body{overflow:hidden}
.pdf{display:block;width:100vw;height:100vh;border:0;background:#fff}
.mobile{display:none;width:100vw;height:auto}
.bar{position:fixed;z-index:20;right:10px;top:10px;display:flex;gap:7px;opacity:.25;transition:.2s}
.bar:hover{opacity:1}
.btn{color:#fff;background:rgba(20,20,20,.9);border:1px solid #777;border-radius:8px;padding:9px 12px;font-size:13px;text-decoration:none;cursor:pointer}
@media(max-width:700px){
 body{background:#111;overflow-y:auto}
 .pdf{display:none}
 .mobile{display:block}
 .bar{top:max(8px,env(safe-area-inset-top));right:8px}
 .btn{font-size:12px;padding:8px 10px}
}
</style>
</head>
<body>
<div class="bar">
<a class="btn" href="./CV_KOLEGIN_IVAN.pdf" download>↓ Скачать PDF</a>
<button class="btn" onclick="document.documentElement.requestFullscreen?.()">⛶ Экран</button>
</div>
<iframe class="pdf" src="./CV_KOLEGIN_IVAN.pdf#view=FitH&toolbar=0&navpanes=0&scrollbar=1" title="CV KOLEGIN IVAN"></iframe>
<img class="mobile" src="./CV_KOLEGIN_IVAN_MOBILE.webp" alt="CV KOLEGIN IVAN">
</body>
</html>
